<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Arcadia SDK Test</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#101926;color:#fff;padding:30px}button{background:#a8efdc;color:#08171b;border:0;padding:14px;margin:5px;border-radius:7px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#1a2c37;padding:14px;border-radius:9px}</style></head><body><h1>✦ Arcadia SDK integration example</h1><p>Try the SDK's local-first save, achievement and score methods.</p><button id="save">Save progress</button><button id="load">Load progress</button><button id="achievement">Unlock achievement</button><button id="score">Submit score</button><pre id="out">Ready.</pre><script src="arcadia-sdk.js"></script><script>const sdk=new ArcadiaSDK({gameId:'sdk-example',allowedParentOrigins:[location.origin]});sdk.ready({title:'SDK Example'});let count=0;async function log(x){document.getElementById('out').textContent=JSON.stringify(x,null,2)}document.getElementById('save').onclick=async()=>log(await sdk.storage.save('slot-1',{count:++count}));document.getElementById('load').onclick=async()=>log(await sdk.storage.load('slot-1'));document.getElementById('achievement').onclick=async()=>log(await sdk.achievements.unlock('first-action'));document.getElementById('score').onclick=async()=>log(await sdk.scores.submit(++count*100));</script></body></html>
