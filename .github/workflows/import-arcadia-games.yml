name: Import authorized Arcadia game collection
on:
  workflow_dispatch:
    inputs:
      collection:
        description: "One reviewed source group"
        required: true
        type: choice
        options:
          - talha
          - minteez
          - poor
          - offline
          - carter
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: arcadia-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import source files and catalog entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          python3 scripts/import_arcadia_collections.py "$COLLECTION"
      - name: Commit imported games
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/ catalog.json
          if git diff --cached --quiet; then
            echo "No new games to import"
            exit 0
          fi
          git commit -m "Import authorized ${{ inputs.collection }} HTML games into Arcadia"
          git push origin HEAD:main
